# Fly.io: `fly launch --copy-config --no-deploy`, then `fly postgres create`, `fly postgres attach`,
# set secrets (see docs/DEPLOY.md) and `fly deploy`.
app = "queueloom"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "queueloom migrate"

[env]
  QUEUELOOM_HOST = "0.0.0.0"
  QUEUELOOM_PORT = "8800"
  QUEUELOOM_HTTPS_ONLY = "true"
  QUEUELOOM_AUTO_MIGRATE = "false"

[http_service]
  internal_port = 8800
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
