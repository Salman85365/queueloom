[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "queueloom"
version = "0.1.0.dev0"
description = "See every background job. Understand why it failed. Observability for Celery tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Salman Arif" }]
keywords = ["celery", "observability", "background-jobs", "monitoring", "redis", "rabbitmq", "fastapi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Celery",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# The SDK depends on almost nothing on purpose: it runs inside your Celery workers.
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
celery = ["celery>=5.3"]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
  "typer>=0.12",
]
ai = ["anthropic>=1.0"]
all = ["queueloom[celery,server,ai]"]
dev = [
  "queueloom[celery,server,ai]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Salman85365/queueloom"
Issues = "https://github.com/Salman85365/queueloom/issues"

[project.scripts]
queueloom = "queueloom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/queueloom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["queueloom", "tests", "demo"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: exercises a real in-process Celery worker"]
filterwarnings = ["error::DeprecationWarning:queueloom.*"]

[tool.coverage.run]
source = ["queueloom"]
branch = true
