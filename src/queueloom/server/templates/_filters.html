<form class="filters" method="get">
  <label>Environment
    <select name="environment"><option value="">all</option>
      {% for e in environments %}<option value="{{ e }}" {% if filters.environment == e %}selected{% endif %}>{{ e }}</option>{% endfor %}
    </select></label>
  <label>Task
    <select name="task_name"><option value="">all</option>
      {% for t in task_names %}<option value="{{ t }}" {% if filters.task_name == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select></label>
  <label>Queue
    <select name="queue"><option value="">all</option>
      {% for q in queues %}<option value="{{ q }}" {% if filters.queue == q %}selected{% endif %}>{{ q }}</option>{% endfor %}
    </select></label>
  {% if show_state %}
  <label>State
    <select name="state"><option value="">all</option>
      {% for s in states %}<option value="{{ s }}" {% if filters.state == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select></label>
  {% endif %}
  <label>Range
    <select name="range">
      {% for r in range_choices %}<option value="{{ r }}" {% if filters.range == r %}selected{% endif %}>last {{ r }}</option>{% endfor %}
    </select></label>
  <button type="submit">Apply</button>
</form>
