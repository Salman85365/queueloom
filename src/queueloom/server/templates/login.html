{% extends "base.html" %}
{% block title %}QueueLoom · sign in{% endblock %}
{% block content %}
<div style="max-width:360px;margin:4rem auto">
  <h1>Sign in</h1>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
  <form method="post" action="/login" style="display:flex;flex-direction:column;gap:.75rem">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label style="display:flex;flex-direction:column;gap:.25rem;color:var(--muted);font-size:.8rem">Dashboard password
      <input type="password" name="password" autofocus autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
