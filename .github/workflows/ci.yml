name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  postgres:
    name: Python 3.12 (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queueloom
          POSTGRES_PASSWORD: queueloom
          POSTGRES_DB: queueloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queueloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          QUEUELOOM_TEST_DATABASE_URL: postgresql+psycopg://queueloom:queueloom@localhost:5432/queueloom_test

  package:
    name: Installed package (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check a fresh install outside the checkout
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          if [ "$DISTRIBUTION" = wheel ]; then
            packages=("$GITHUB_WORKSPACE"/dist/*.whl)
          else
            packages=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          fi
          package="${packages[0]}"
          python -m venv "$RUNNER_TEMP/package-env"
          source "$RUNNER_TEMP/package-env/bin/activate"
          cp scripts/check_installed_package.py "$RUNNER_TEMP/check_installed_package.py"
          cd "$RUNNER_TEMP"
          python -m pip install "$package"
          python -m pip check
          python check_installed_package.py --sdk-only
          python -m pip install "$package[server,celery]"
          python -m pip check
          python check_installed_package.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t queueloom:ci .
      - run: docker run --rm queueloom:ci queueloom --version
